.mc .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}

.mc .hero .kicker{font-size:13px;color:var(--mute);margin-bottom:6px}
.mc .hero .title{font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.1;margin:0 0 8px}
.mc .hero .desc{font-size:16px;line-height:1.45}
.mc .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

.mc .stack{display:flex;flex-direction:column;gap:2px}

.mc button.primary{background:var(--hi);color:#1A1A12;border-color:var(--hi);font-weight:600;width:100%;padding:14px;font-size:17px;border-radius:12px}
.mc button.ghost{background:transparent}

.mc input[type=number]{-moz-appearance:textfield}
.mc input:focus,.mc textarea:focus{outline:2px solid var(--hi);outline-offset:0;border-color:var(--hi)}
.mc label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.mc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.mc .nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}

.mc .reps{display:flex;gap:6px}
.mc .reps input{padding:8px 6px;text-align:center}
.mc .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px}
.mc details summary{cursor:pointer;list-style:none}

.mc .pace.on{border-color:var(--hi)}
.mc .pace.rec{border-color:var(--ok)}
.mc .pace.rec .big{color:var(--ok)}
.mc .ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.mc .ctrl button{padding:16px 8px;font-size:16px;font-weight:600}
.mc .segs{max-height:220px;overflow:auto;margin-top:12px}
.mc .segs .row{padding:6px 0}
.mc .segs .cur{color:var(--hi)}
.mc .segs .done{color:var(--mute);text-decoration:line-through}
